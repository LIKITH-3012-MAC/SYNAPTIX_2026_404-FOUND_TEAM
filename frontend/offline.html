<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — RESOLVIT</title>
  <meta name="theme-color" content="#0b0f19" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pwa.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      background-image: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15), transparent 70%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1), transparent 60%);
    }

    .offline-card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .offline-icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .offline-icon-wrapper svg {
      width: 40px;
      height: 40px;
      color: #ef4444;
    }

    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .offline-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 2rem;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .btn-retry {
      width: 100%;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .cached-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .cached-link {
      padding: 0.75rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .cached-link:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(99, 102, 241, 0.4);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-badge">
      <span class="dot"></span> Connection Lost
    </div>

    <div class="offline-icon-wrapper">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a9 9 0 010-12.728M5.636 5.636l12.728 12.728M12 12a1 1 0 100-2 1 1 0 000 2z"></path>
      </svg>
    </div>

    <h1>You Are Offline</h1>
    <p>You appear to have lost network connectivity. RESOLVIT is saved locally. You can try reconnecting or visit cached sections of the platform.</p>

    <div class="action-group">
      <button class="btn-retry" onclick="attemptReconnect()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Retry Connection
      </button>
      
      <div class="cached-links">
        <a href="/" class="cached-link">Home Page</a>
        <a href="/dashboard.html" class="cached-link">Dashboard</a>
        <a href="/submit.html" class="cached-link">Report Issue</a>
        <a href="/care.html" class="cached-link">RESOLVIT Care</a>
      </div>
    </div>
  </div>

  <script>
    function attemptReconnect() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.btn-retry');
        const oldText = btn.innerHTML;
        btn.innerHTML = 'Still Offline...';
        setTimeout(() => {
          btn.innerHTML = oldText;
        }, 1500);
      }
    }

    // Auto-reload when network connectivity is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
